name: foo
description: Common utils
version: 0.1.0+1
publish_to: none

environment:
  sdk: ">=3.8.0"
  flutter: ">=3.10.0"

dependencies:
  api_tools:
    git:
      url: https://github.com/abdulhaq-e/api_tools.git
      ref: master
  bloc: ^9.0.0
  decimal: ^3.2.4
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.0
  freezed_annotation: ^3.1.0
  go_router: ^18.0.0
  intl: ^0.20.2
  json_annotation: ^4.12.0
  bind_forms:
    git:
      url: https://github.com/abdulhaq-e/bind_forms.git
      ref: main
      path: packages/bind_forms
  bind_forms_streams:
    git:
      url: https://github.com/abdulhaq-e/bind_forms.git
      ref: main
      path: packages/bind_forms_streams
  uuid: ^4.2.1
  flutter_secure_storage: ^11.2.0
  firebase_auth: ^7.0.1
  flutter_signin_button:
    git:
      url: https://github.com/abdulhaq-e/Flutter-Sign-in-Button.git
      ref: feat/font_awesome_upgrade
  firebase_core: ^5.1.0
  flutter_dotenv: ^6.0.0

  material_ui: any
  web: any
  http: any
dependency_overrides:
  # bind_forms and bind_forms_streams depend on the hosted bind_forms_core;
  # use the same git revision as them.
  bind_forms_core:
    git:
      url: https://github.com/abdulhaq-e/bind_forms.git
      ref: main
      path: packages/bind_forms_core

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.7.0
  freezed: ^4.0.0
  json_serializable: ^6.11.0
  very_good_analysis: ^11.0.0

  test: any
flutter:
  uses-material-design: true
  generate: true
